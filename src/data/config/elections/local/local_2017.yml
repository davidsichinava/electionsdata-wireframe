id: local_2017
type: local
date: "2017-10-21"
name:
  en: "2017 elections of municipal authorities"
  ka: "მუნიციპალიტეტის ორგანოთა 2017 წლის არჩევნები"
notes:
  en: |
    For this elections, previous self-governing cities were abolished, and elections were held in 64 municipalities. Mayor and Sakrebulo majoritarian contests in several municipalities
    proceeded to a second round held on 11 November 2017.
  ka: |
    2017 წლის არჩევნებისთვის, გაუქმდა წინა არჩევნებზე გამოყოფილი თვითმმართველი ქალაქები, შესაბამისად, არჩევნები გაიმართა 64 მუნიციპალიტეტში
    ზოგიერთ მუნიციპალიტეტში მერებისა და
    საკრებულოს მაჟორიტარი კანდიდატების გამოსავლენად, 2017 წლის 11 ნოემბერს მეორე ტური
    ჩატარდა.

# ── Electoral system ──────────────────────────────────────────────────────
system:
  pr:
    enabled: true
    seats: 0                        # varies by municipality
    threshold_pct: 3.0              # 3% threshold
    method: dhondt
    shape_file: "data/shp/parl2024_pr.geojson"
    selfgov_shape_file: "data/shp/selfgov_areas_2025.geojson"
    precinct_shape_file: "data/shp/local2017_precincts.geojson"
  smd:
    enabled: true
    seats: 64                       # 64 self-governing units
    shape_file: "data/shp/selfgov_areas_2025.geojson"
    precinct_shape_file: "data/shp/local2017_precincts.geojson"
  compensation:
    enabled: false
    shape_file: null

map_view:
  default_level: selfgov
  default_vote_type: pr

# ── Council (Sakrebulo majoritarian) ─────────────────────────────────────
council:
  total_pr_seats: 0
  total_smd_seats: 0
  shape_file: "data/shp/majoritarian_2017_major_id.geojson"

sub_elections:
  - id: local_2017_r2
    type: runoff
    name:
      en: Second Round
      ka: კენჭისყრის მეორე ტური
    files:
      smd_results:                  "data/results/local2017_r2_smd.csv"
      smd_precinct_results:         "data/results/local2017_r2_smd_precincts.csv"
      council_smd_results:          "data/results/local2017_r2_council_smd.csv"
      council_smd_precinct_results: "data/results/local2017_r2_council_smd_precincts.csv"
  - id: local_2017_zugdidi_2018_sakrebulo_smd
    type: by_election
    date: "2018-05-13"
    download_key: "20180513"
    name:
      en: May 13, 2018 Zugdidi Sakrebulo by-election
      ka: 2018 წლის 13 მაისის ზუგდიდის საკრებულოს შუალედური არჩევნები
    files:
      smd_results:                  "data/results/local2017_zugdidi_2018_smd.csv"
      smd_precinct_results:         "data/results/local2017_zugdidi_2018_smd_precincts.csv"
      council_smd_results:          "data/results/local2017_zugdidi_2018_council_smd.csv"
      council_smd_precinct_results: "data/results/local2017_zugdidi_2018_council_smd_precincts.csv"
  - id: local_2017_2019_by_elections
    type: by_election
    date: "2019-05-19"
    download_key: "20190519"
    name:
      en: May 19, 2019 Local by-elections
      ka: 2019 წლის 19 მაისის ადგილობრივი შუალედური და რიგგარეშე არჩევნები
    files:
      smd_results:                  "data/results/local2017_2019_byelections_smd.csv"
      smd_precinct_results:         "data/results/local2017_2019_byelections_smd_precincts.csv"
      council_smd_results:          "data/results/local2017_2019_byelections_council_smd.csv"
      council_smd_precinct_results: "data/results/local2017_2019_byelections_council_smd_precincts.csv"
  - id: local_2017_2019_oct_sakrebulo_by_elections
    type: by_election
    date: "2019-10-27"
    download_key: "20191027"
    name:
      en: October 27, 2019 Sakrebulo by-elections
      ka: 2019 წლის 27 ოქტომბრის საკრებულოს შუალედური არჩევნები
    files:
      smd_results:                  "data/results/local2017_2019_oct_byelections_smd.csv"
      smd_precinct_results:         "data/results/local2017_2019_oct_byelections_smd_precincts.csv"
      council_smd_results:          "data/results/local2017_2019_oct_byelections_council_smd.csv"
      council_smd_precinct_results: "data/results/local2017_2019_oct_byelections_council_smd_precincts.csv"
  - id: local_2017_2020_by_elections
    type: by_election
    date: "2020-10-31"
    download_key: "20201031"
    name:
      en: October 31, 2020 local by-elections
      ka: 2020 წლის 31 ოქტომბრის ადგილობრივი შუალედური არჩევნები
    files:
      smd_results:                  "data/results/local2017_2020_byelections_smd.csv"
      smd_precinct_results:         "data/results/local2017_2020_byelections_smd_precincts.csv"
      council_smd_results:          "data/results/local2017_2020_byelections_council_smd.csv"
      council_smd_precinct_results: "data/results/local2017_2020_byelections_council_smd_precincts.csv"
  - id: local_2017_2020_by_elections_runoff
    type: runoff
    date: "2020-11-21"
    download_key: "20201121"
    name:
      en: November 21, 2020 mayoral runoff
      ka: 2020 წლის 21 ნოემბრის მერის არჩევნების მეორე ტური
    files:
      smd_results:                  "data/results/local2017_2020_byelections_smd_runoff.csv"
      smd_precinct_results:         "data/results/local2017_2020_byelections_smd_runoff_precincts.csv"
      council_smd_results:          "data/results/local2017_2020_byelections_council_smd_runoff.csv"
      council_smd_precinct_results: "data/results/local2017_2020_byelections_council_smd_runoff_precincts.csv"

# ── Party metadata ────────────────────────────────────────────────────────
# threshold_status reflects the national 3% Sakrebulo PR threshold.
parties:
  - id: gd
    threshold_status: passed
    alias:
      ka: ქართული ოცნება - დემოკრატიული საქართველო
  - id: unm
    threshold_status: passed
  - id: european_georgia
    threshold_status: passed
    alias:
      ka: ევროპული საქართველო-მოძრაობა თავისუფლებისთვის
  - id: zugdidi_2018_2
    threshold_status: notrun
    color: "#C62828"
    alias:
      ka: გოდერძი კუკავა
      en: Goderdzi Kukava
  - id: zugdidi_2018_32
    threshold_status: notrun
    color: "#78909C"
    alias:
      ka: ბაჩუკი ნარუშვილი
      en: Bachuki Narushvili
  - id: zugdidi_2018_41
    threshold_status: notrun
    color: "#1565C0"
    alias:
      ka: თენგიზ ალმასია
      en: Tengiz Almasia
  - id: patriots
    threshold_status: passed
    alias:
      ka: დავით თარხან-მოურავი, ირმა ინაშვილი - საქართველოს პატრიოტთა ალიანსი
      en: Davit Tarkhan-Mouravi, Irma Inashvili - Alliance of Patriots of Georgia
  - id: labour
    threshold_status: passed
    alias:
      ka: შალვა ნათელაშვილი-საქართველოს ლეიბორისტული პარტია
      en: Shalva Natelashvili-Labour Party of Georgia
  - id: republicans_2016
    alias:
      ka: „რესპუბლიკური პარტია”
      en: "Republican Party"
    threshold_status: failed
  - id: new_christian_democrats
    threshold_status: failed
    alias:
      ka: გოგი წულაია - ახალი ქრისტიანდემოკრატები
      en: Gogi Tsulaia - New Christian Democrats
  # ── 2017-only sakrebulo PR labels (promoted from candidate XLSX) ────────
  - id: progressive_democratic_2017
    threshold_status: failed
    alias:
      en: "Progressive-Democratic Movement"
      ka: "პროგრესულ-დემოკრატიული მოძრაობა"
  - id: peoples_unity_2017
    threshold_status: failed
    alias:
      en: "People's — People's Unity"
      ka: "სახალხო-ხალხის ერთსულოვნება"
  - id: construction_movement_2017
    threshold_status: failed
    alias:
      en: "Construction Movement"
      ka: "შენების მოძრაობა"
  - id: new_rights_2017
    threshold_status: failed
    alias:
      en: "New Rights"
      ka: "ახალი მემარჯვენეები"
  - id: united_democratic_2017
    threshold_status: failed
    alias:
      en: "United Democratic Movement"
      ka: "გაერთიანებული დემოკრატიული მოძრაობა"

# ── Data files ────────────────────────────────────────────────────────────
sources:
  - name:
      en: "Public information requested from the Central Election Commission as part of the preparation of the National Democratic Institute's (NDI) election portal electionsdata.ge"
      ka: >-
        „ეროვნული დემოკრატიული ინსტიტუტის" (NDI) საარჩევნო პორტალის
        electionsdata.ge მომზადების ფარგლებში ცენტრალური საარჩევნო
        კომისიიდან გამოთხოვნილი საჯარო ინფორმაცია


files:
  seats:                        "data/results/local2017_seats.csv"
  pr_results:                   "data/results/local2017_pr.csv"
  pr_selfgov_results:           "data/results/local2017_pr_selfgov.csv"
  pr_precinct_results:          "data/results/local2017_pr_precincts.csv"
  smd_results:                  "data/results/local2017_smd.csv"
  smd_district_results:         "data/results/local2017_smd_districts.csv"
  smd_precinct_results:         "data/results/local2017_smd_precincts.csv"
  council_smd_results:          "data/results/local2017_council_smd.csv"
  council_smd_precinct_results: "data/results/local2017_council_smd_precincts.csv"
  council_pr_results:           "data/results/local2017_pr.csv"
  council_pr_precinct_results:  "data/results/local2017_pr_precincts.csv"

# ── Turnout metadata ──────────────────────────────────────────────────────
turnout:
  available: true
  type: basic
  file: null
  precinct_file: null
  has_snapshots: true    # voted_noon / voted_5pm columns present in CSVs
  has_lists: false
